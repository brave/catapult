name: Deploy to App Engine

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-to-appengine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: 'replace-strings'
        run: brave/replace_strings.sh

      - name: npm audit fix
        continue-on-error: true
        run: |
          cd common/node_runner/node_runner/
          npm audit fix

      - id: 'auth'
        uses: google-github-actions/auth@35b0e87d162680511bf346c299f71c9c5c379033 # v1.1.1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY}}'
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          project_id: 'brave-perf-dashboard'
          version: '517.0.0'
      - name: Set up Python 3 and deploy via script
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.9'
      - run: python dashboard/bin/deploy --promote app.yaml api.yaml upload.yaml upload-processing.yaml dispatch.yaml cron.yaml index.yaml
        env:
          VERSION: ${{github.run_number}}
